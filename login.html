<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Urban Threads Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded">
</head>
<body>

    <div class="auth-page">

        <div class="auth-panel-form">
            <a href="index.html" class="auth-logo">
                <img src="images/logo.png" alt="Urban Threads">
            </a>

            <div class="auth-content">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-tab="login">Sign in</button>
                    <button type="button" class="auth-tab" data-tab="signup">Create account</button>
                </div>

                <h1 class="auth-heading" id="auth-heading">Welcome back</h1>
                <p class="auth-subheading" id="auth-subheading">Sign in to pick up your cart and wishlist.</p>

                <button class="google-btn" id="google-signin-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z" fill="#34A853"/>
                        <path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84Z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38Z" fill="#EB4335"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="form-divider">or</div>

                <!-- LOGIN FORM -->
                <form id="login-form" novalidate>
                    <div class="field-box">
                        <input class="field-input" type="email" id="login-email" placeholder=" " autocomplete="email">
                        <label class="field-label" for="login-email">Email</label>
                    </div>
                    <div class="form-error" id="login-email-error"></div>

                    <div class="field-box">
                        <input class="field-input" type="password" id="login-password" placeholder=" " autocomplete="current-password">
                        <label class="field-label" for="login-password">Password</label>
                    </div>
                    <div class="form-error" id="login-password-error"></div>

                    <div class="form-error" id="login-form-error"></div>
                    <button class="auth-submit" type="submit" id="login-submit">Sign in</button>
                </form>

                <!-- SIGNUP FORM -->
                <form id="signup-form" novalidate style="display:none;">
                    <div class="field-box">
                        <input class="field-input" type="text" id="signup-name" placeholder=" " autocomplete="name">
                        <label class="field-label" for="signup-name">Name</label>
                    </div>

                    <div class="field-box">
                        <input class="field-input" type="email" id="signup-email" placeholder=" " autocomplete="email">
                        <label class="field-label" for="signup-email">Email</label>
                    </div>
                    <div class="form-error" id="signup-email-error"></div>

                    <div class="field-box">
                        <input class="field-input" type="password" id="signup-password" placeholder=" " autocomplete="new-password">
                        <label class="field-label" for="signup-password">Password</label>
                    </div>
                    <div class="form-error" id="signup-password-error"></div>

                    <div class="field-box">
                        <input class="field-input" type="password" id="signup-confirm" placeholder=" " autocomplete="new-password">
                        <label class="field-label" for="signup-confirm">Confirm password</label>
                    </div>
                    <div class="form-error" id="signup-confirm-error"></div>

                    <div class="form-error" id="signup-form-error"></div>
                    <button class="auth-submit" type="submit" id="signup-submit">Create account</button>
                </form>

                <p class="auth-switch" id="auth-switch">
                    Don't have an account? <button type="button" class="auth-switch-link" data-switch-to="signup">Create one</button>
                </p>
            </div>
        </div>

        <div class="auth-panel-visual">
            <div class="grain-layer"></div>
            <div class="auth-visual-content">
                <h2 class="auth-visual-heading">Where normal<br>means rebellion.</h2>
                <a href="shop.html" class="auth-visual-link">
                    <span class="material-symbols-rounded">arrow_forward</span>
                    Continue browsing
                </a>
            </div>
        </div>

    </div>

    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script>
        // Tab + form switching — inline, same pattern as before, just extended
        // to also swap the heading/subheading/switch-link text for each mode.
        const tabs = document.querySelectorAll('.auth-tab');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const authHeading = document.getElementById('auth-heading');
        const authSubheading = document.getElementById('auth-subheading');
        const authSwitch = document.getElementById('auth-switch');

        function bindSwitchLinks() {
            document.querySelectorAll('[data-switch-to]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    btn.dataset.switchTo === 'signup' ? showSignup() : showLogin();
                });
            });
        }

        function showLogin() {
            tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === 'login'));
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            authHeading.textContent = 'Welcome back';
            authSubheading.textContent = 'Sign in to pick up your cart and wishlist.';
            authSwitch.innerHTML = `Don't have an account? <button type="button" class="auth-switch-link" data-switch-to="signup">Create one</button>`;
            bindSwitchLinks();
        }

        function showSignup() {
            tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === 'signup'));
            signupForm.style.display = 'block';
            loginForm.style.display = 'none';
            authHeading.textContent = 'Create an account';
            authSubheading.textContent = 'Join Urban Threads to save your cart and wishlist.';
            authSwitch.innerHTML = `Already have an account? <button type="button" class="auth-switch-link" data-switch-to="login">Sign in</button>`;
            bindSwitchLinks();
        }

        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                tab.dataset.tab === 'signup' ? showSignup() : showLogin();
            });
        });

        bindSwitchLinks();
    </script>
</body>
</html>
