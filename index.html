<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Threads Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="assets/images/logo1.png" alt="Urban Threads Store">
        </div>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="shop.html?category=Hoodies">Hoodies</a>
            <a href="shop.html?category=T-Shirts">T-shirts</a>
            <a href="shop.html?category=Sneakers">Sneakers</a>
            <a href="shop.html?category=Accessories">Accessories</a>
        </div>

        <!-- Search Bar -->
       
        <form class="search-bar" method="get" action="shop.html">
            <input type="text" name="search" placeholder="Search...">
            <button type="submit" aria-label="Search">
                <span class="material-symbols-rounded">search</span>
            </button>
        </form>
       
        <!-- User Authentication -->
        <div class="nav-icons">
            <span id="nav-auth-status">
                <a href="login.html" aria-label="Account">
                    <span class="material-symbols-rounded">person</span>
                </a>
            </span>
            <a href="cart.html" aria-label="Cart">
                <span class="material-symbols-rounded">shopping_cart</span>
                <span id="nav-cart-count" class="cart-count" style="display: none;">0</span>
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span>NEW DROP</span>
            <h1>Where Normal Means Rebellion</h1>
            <a href="shop.html" class="cta-button">Shop Now</a>
        </div>
    </section>
    
    <script type="module" src="js/navbar.js"></script>
</body>
</html>
